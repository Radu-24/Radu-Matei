# The CV download counter (see README.md in this folder). Deploy with: npx wrangler deploy
name = "radumatei-cv-counter"
main = "src/index.js"
compatibility_date = "2025-09-01"

# served only on its own address; no *.workers.dev address
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.radumatei.ro", custom_domain = true }]

# where the CV itself lives (the site on GitHub Pages)
[vars]
PDF_URL = "https://radumatei.ro/assets/doc/Radu-Matei-CV.pdf"

# the total: one SQLite-backed Durable Object (available on the Workers Free plan)
[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]

# no logs: the privacy notice says nothing about visitors is kept here
[observability]
enabled = false
